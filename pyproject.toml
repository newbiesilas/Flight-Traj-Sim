[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flighttrajsim"
version = "1.0.0"
description = "Point-mass aircraft trajectory simulation: climb, cruise and descent, dependency-free"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Silas Zhang" }]
keywords = [
    "aerospace",
    "flight-dynamics",
    "trajectory",
    "simulation",
    "atmosphere",
    "breguet",
    "performance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/newbiesilas/Flight-Traj-Sim"
Repository = "https://github.com/newbiesilas/Flight-Traj-Sim"
Issues = "https://github.com/newbiesilas/Flight-Traj-Sim/issues"

[project.scripts]
flighttrajsim = "flighttrajsim.cli:main"
flighttrajsim-gui = "desktop.app:main"

[tool.setuptools]
packages = ["flighttrajsim", "desktop"]

[tool.setuptools.package-data]
flighttrajsim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
